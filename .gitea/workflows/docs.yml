# 知识库发布：push main → 构建 MkDocs → 强推 pages 分支
# NAS 的 Gitea post-receive 钩子检出 pages 分支即完成部署（见 modules/services/docs.nix）
# 注意：把下方 <owner> 替换为你的 Gitea 用户名；secret PAGES_TOKEN 为 write:repository 权限的 API token
name: Deploy Docs

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        env:
          GITEA_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          apt-get update && apt-get install -y git >/dev/null
          git clone --depth 1 --branch main "http://oauth2:${GITEA_TOKEN}@127.0.0.1:3000/zhou/nas-nix.git" /tmp/repo
      - name: 构建 MkDocs
        working-directory: /tmp/repo
        run: |
          apt-get install -y python3-pip python3-venv >/dev/null
          # Debian Bookworm Python 受 PEP 668 保护，系统级 pip install 被拒，
          # 故在虚拟环境中安装 mkdocs-material
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q mkdocs-material
          /tmp/venv/bin/mkdocs build --site-dir /tmp/site
      - name: 发布到 pages 分支
        env:
          GITEA_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          cd /tmp/repo
          git config --global user.name "nas-docs"
          git config --global user.email "docs@nas.local"
          git remote set-url origin "http://oauth2:${GITEA_TOKEN}@127.0.0.1:3000/zhou/nas-nix.git"
          git branch -D pages 2>/dev/null || true
          git checkout --orphan pages
          git rm -rf . 2>/dev/null || true
          cp -r /tmp/site/. .
          git add -A
          git commit -m "pages: rebuild site"
          git push -f origin pages
