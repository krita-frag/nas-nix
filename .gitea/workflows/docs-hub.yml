# 知识库中心统一发布：push hub main → build.sh 合并各注册仓库 docs/ →
# 单一 MkDocs 站点（统一主题/导航/搜索）→ 直接部署到 /var/www/docs（runner 容器挂载）
# → 强推 pages 分支作为构建完成信号。
#
# 本 workflow 只存在于 hub 仓库（nas-nix），内容仓库无需任何 workflow / token / 钩子。
# 注册新知识库：在 docs-hub/repos.json 的 repos 列表加一行（owner/name + 可选 desc），
# 内容仓库根目录需有 docs/（MkDocs Material Markdown 源）。仅 hub 仓库需 PAGES_TOKEN
# （write:repository 权限 API token，用于 clone 各仓库与强推 pages）。
name: Deploy Docs Hub

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 环境准备（git / python）
        run: |
          apt-get update && apt-get install -y git python3-pip python3-venv >/dev/null
      - name: 检出 hub 仓库
        env:
          GITEA_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          git clone --depth 1 --branch main "http://oauth2:${GITEA_TOKEN}@127.0.0.1:3000/${{ github.repository }}.git" /tmp/hub
      - name: 统一构建全部注册知识库（docs-hub/build.sh → 单一 MkDocs 站点）
        env:
          GITEA_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          bash /tmp/hub/docs-hub/build.sh
      - name: 部署到 /var/www/docs（runner 容器挂载站点根）
        run: |
          rm -rf /var/www/docs/* /var/www/docs/.[!.]* /var/www/docs/..?* 2>/dev/null || true
          cp -r /tmp/hub-site/. /var/www/docs/
          echo "站点已部署:"
          ls /var/www/docs/
      - name: 强推 pages 分支（构建完成信号，供 deploy.sh publish 轮询）
        env:
          GITEA_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          cd /tmp/hub
          git config --global user.name "nas-docs"
          git config --global user.email "docs@nas.local"
          git remote set-url origin "http://oauth2:${GITEA_TOKEN}@127.0.0.1:3000/${{ github.repository }}.git"
          git branch -D pages 2>/dev/null || true
          git checkout --orphan pages
          git rm -rf . 2>/dev/null || true
          cp -r /tmp/hub-site/. .
          git add -A
          git commit -m "pages: rebuild hub site"
          git push -f origin pages
