# MkDocs 配置：NAS 运维知识库
# 文档源为 docs/ 目录，由 Gitea Actions 构建并发布到 Pages（见 .gitea/workflows/pages.yml）
site_name: NAS 运维知识库
site_description: nas-nix 声明式配置与运维文档
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换至暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换至亮色

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

copyright: nas-nix
