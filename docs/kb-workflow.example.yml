# 知识库注册模板：任意 Gitea 仓库复制本文件为 .gitea/workflows/docs.yml 即可使用。
#
# 效果：push main → 构建 MkDocs → 强推 pages 分支 → NAS post-receive 钩子
# 就地部署到知识库中心子目录（http://<nas-ip>:8080/<owner>/<name>/），并在主页聚合链接。
#
# 注册步骤（详见 nas-nix README「知识库中心」一节）：
#   1. 在 nas-nix 的 hosts/nas/default.nix 把仓库加入 services.docs.repos 列表并部署；
#   2. 本仓库根目录放 mkdocs.yml + docs/ 知识库源；
#   3. 复制本文件为 .gitea/workflows/docs.yml；
#   4. 仓库设置 → Actions → Secrets 添加 PAGES_TOKEN（write:repository 权限 API token）。
#
# 本文件使用 ${{ github.repository }} 自动适配仓库，无需修改任何路径。
name: Deploy Docs

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        env:
          GITEA_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          apt-get update && apt-get install -y git >/dev/null
          git clone --depth 1 --branch main "http://oauth2:${GITEA_TOKEN}@127.0.0.1:3000/${{ github.repository }}.git" /tmp/repo
      - name: 构建 MkDocs
        working-directory: /tmp/repo
        run: |
          apt-get install -y python3-pip python3-venv >/dev/null
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q mkdocs-material
          /tmp/venv/bin/mkdocs build --site-dir /tmp/site
      - name: 发布到 pages 分支
        env:
          GITEA_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          cd /tmp/repo
          git config --global user.name "nas-docs"
          git config --global user.email "docs@nas.local"
          git remote set-url origin "http://oauth2:${GITEA_TOKEN}@127.0.0.1:3000/${{ github.repository }}.git"
          git branch -D pages 2>/dev/null || true
          git checkout --orphan pages
          git rm -rf . 2>/dev/null || true
          cp -r /tmp/site/. .
          git add -A
          git commit -m "pages: rebuild site"
          git push -f origin pages
