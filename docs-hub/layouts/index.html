{{ $count := len site.Data.repos.repos }}
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      line-height: 1.6;
    }
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      padding: 3rem 1.5rem 2.5rem;
      text-align: center;
    }
    header h1 { margin: 0 0 .4rem; font-size: 1.9rem; font-weight: 600; }
    header .sub { margin: 0; color: #94a3b8; font-size: .95rem; }
    main.grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
      max-width: 64rem;
      margin: -1.2rem auto 2.5rem;
      padding: 0 1.5rem;
    }
    a.card {
      display: block;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: .75rem;
      padding: 1.25rem 1.35rem;
      text-decoration: none;
      color: inherit;
      transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    }
    a.card:hover {
      box-shadow: 0 10px 28px rgba(15, 23, 42, .1);
      transform: translateY(-3px);
      border-color: #93c5fd;
    }
    a.card h2 { margin: 0 0 .3rem; font-size: 1.05rem; color: #0f172a; }
    a.card .owner { color: #64748b; font-size: .8rem; letter-spacing: .02em; }
    a.card .desc { margin: .55rem 0 0; color: #475569; font-size: .85rem; line-height: 1.55; }
    footer {
      text-align: center;
      color: #94a3b8;
      font-size: .8rem;
      padding: 1.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ .Site.Title }}</h1>
    <p class="sub">{{ $count }} 个知识库 · 由 Gitea Actions 统一构建</p>
  </header>
  <main class="grid">
    {{ range site.Data.repos.repos }}
    <a class="card" href="/{{ .owner }}/{{ .name }}/">
      <h2>{{ .name }}</h2>
      <div class="owner">{{ .owner }}</div>
      {{ with .desc }}<p class="desc">{{ . }}</p>{{ end }}
    </a>
    {{ end }}
  </main>
  <footer>Powered by MkDocs Material · Hugo · Caddy</footer>
</body>
</html>
