# 知识库中心统一站点配置（单一 MkDocs 站点）
#
# 本文件是构建模板：build.sh 会把它复制到临时构建目录，并从 repos.json
# 动态追加 nav（每个注册知识库一个顶部 tab），随后以统一 docs_dir 构建。
# 全站共享同一主题、同一导航、全站搜索 —— 消除多子站割裂。
site_name: NAS 知识库中心
site_url: http://localhost:8080/
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至亮色

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - footnotes

plugins:
  - search

extra_css:
  - extra.css

extra:
  generator: false

copyright: NAS 知识库中心
